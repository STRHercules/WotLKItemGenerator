name: Windows build verification

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 90

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
          components: rustfmt, clippy

      - name: Install Python verification and build dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest
          python -m pip install -r engine/requirements-build.txt

      - name: Install frontend dependencies
        shell: pwsh
        run: npm install

      - name: Verify and build Windows release
        shell: pwsh
        run: .\scripts\build-windows-release.ps1

      - name: Upload unsigned Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: wotlk-item-forge-windows-unsigned
          if-no-files-found: error
          retention-days: 14
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/wotlk-item-forge.exe
            dist/release-evidence/release-manifest.json
            package-lock.json
            src-tauri/Cargo.lock
